<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross-Domain NLP Feature Walkthrough</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
  <main class="container" style="max-width: 820px;">
    <section class="card p-4 shadow-sm mb-4">
      <h1 class="h4">Cross-Domain NLP Feature Walkthrough</h1>
      <p class="text-muted">Illustrative rule trace only. No trained model, confidence calibration, or live dataset is loaded in this page.</p>
      <label for="textInput" class="form-label">Example review text</label>
      <textarea id="textInput" class="form-control" rows="4">The film was kind of good, but honestly a bit disappointing overall.</textarea>
      <button class="btn btn-dark mt-3" onclick="runWalkthrough()">Show feature trace</button>
    </section>
    <section id="resultCard" class="card p-4 shadow-sm" hidden>
      <h2 class="h6">Illustrative feature trace</h2>
      <p id="resultText" class="mb-0"></p>
    </section>
  </main>
  <script>
    function runWalkthrough() {
      const text = document.getElementById("textInput").value.trim().toLowerCase();
      const markers = ["slightly", "somewhat", "rather", "fairly", "barely", "hardly", "partly", "partially", "relatively", "moderately", "kind of", "kinda", "sort of", "a bit", "a little", "honestly"];
      const markerCount = markers.filter((marker) => text.includes(marker)).length;
      const hasContrast = ["but", "however", "although", "though"].some((marker) => text.includes(marker));
      const hasPositive = ["good", "great", "love", "like", "awesome", "excellent", "happy", "wonderful"].some((marker) => text.includes(marker));
      const hasNegative = ["bad", "terrible", "awful", "hate", "sad", "disappointed", "disappointing", "poor", "rude"].some((marker) => text.includes(marker));
      const message = "Detected " + markerCount + " downtoner markers; contrast=" + hasContrast + "; positive terms=" + hasPositive + "; negative terms=" + hasNegative + ". This is a deterministic explanation trace, not a model prediction or a validated correction.";
      document.getElementById("resultText").textContent = message;
      document.getElementById("resultCard").hidden = false;
    }
  </script>
</body>
</html>
